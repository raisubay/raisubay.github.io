<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tari</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4eee5;
            color: #3b2418;
        }

        header {
            background: #6b2f2f;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .video-box {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .video {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
        }

        .video iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border: none;
        }

        .description {
            text-align: center;
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .description h2 {
            margin-bottom: 12px;
            color: #6b2f2f;
        }

        .description p {
            line-height: 1.7;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #6b2f2f;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>VIDEO TARI</h1>
        <p>Menampilkan video tari tradisional</p>
    </header>

    <div class="container">

        <div class="video-box">
            <div class="video">
                <iframe
                    src="https://www.youtube.com/embed/y_foL31LnYo"
                    title="Video Tari"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="description">
            <h2>Tentang Video</h2>
            <p>
                Video ini menampilkan pertunjukan tari yang dapat menjadi
                referensi untuk mengenal seni dan budaya tradisional Indonesia.
            </p>
        </div>

    </div>

    <footer>
        <p>© 2026 Website Tari Tradisional</p>
    </footer>

</body>
</html>
